<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORION // Secure Uplink</title>
  <link rel="stylesheet" href="Arma3 Orion - Finland Campagne - Storyboard.css">
  <link rel="stylesheet" href="Arma3 Orion - Finland Campagne - Briefing.css">
</head>
<body>
  <main class="decrypt-overlay" id="secure-uplink" role="button" tabindex="0" aria-label="Skip secure uplink sequence">
    <div class="decrypt-terminal" aria-live="polite">
      <div class="decrypt-line">ORION SECURE UPLINK &mdash; CHANNEL 21</div>
      <div class="decrypt-line">AUTHENTICATING OPERATOR...</div>
      <div class="decrypt-line">CLEARANCE CONFIRMED &mdash; HADES PLATOON</div>
      <div class="decrypt-line">LOADING GLOBAL OPERATIONS NETWORK...</div>
      <div class="decrypt-progress"><span></span></div>
    </div>
    <div class="decrypt-skip">CLICK OR PRESS ANY KEY TO SKIP</div>
  </main>

  <script>
    const uplink = document.getElementById('secure-uplink');
    const lines = uplink.querySelectorAll('.decrypt-line');
    const progress = uplink.querySelector('.decrypt-progress span');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let leaving = false;

    function continueToHome() {
      if (leaving) return;
      leaving = true;
      window.location.href = 'Arma3 Orion - Finland Campagne - Home.html';
    }

    function runUplink() {
      if (reduceMotion) {
        lines.forEach((line) => line.classList.add('show'));
        progress.classList.add('load');
        window.setTimeout(continueToHome, 250);
        return;
      }

      lines.forEach((line, index) => {
        window.setTimeout(() => line.classList.add('show'), 350 + (index * 550));
      });
      window.setTimeout(() => progress.classList.add('load'), 2600);
      window.setTimeout(continueToHome, 3950);
    }

    uplink.addEventListener('click', continueToHome);
    window.addEventListener('keydown', continueToHome, { once: true });
    runUplink();
  </script>
</body>
</html>
